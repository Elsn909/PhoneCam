<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhoneCam</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
  video { width: 100%; max-height: 55vh; background: #000; display: block; object-fit: contain; }
  .bar { padding: 12px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #eee; }
  button.main { background: #2b6cff; border-color: #2b6cff; flex: 1; font-weight: 600; }
  button.stop { background: #c33; border-color: #c33; }
  #status { color: #aaa; font-size: 14px; white-space: pre-line; }
  label { font-size: 13px; color: #bbb; display: grid; gap: 4px; }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 16px; color: #eee; }
  label.check input { width: 22px; height: 22px; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<div class="bar">
  <div class="row">
    <button id="go" class="main">Démarrer</button>
    <button id="flip">↺ Caméra</button>
    <button id="light" title="Lampe (caméra arrière)">💡</button>
  </div>
  <div class="row">
    <button id="app" style="flex:1">📱 Ouvrir dans l'appli PhoneCam (continue en arrière-plan)</button>
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="cam" checked> 📷 Caméra</label>
    <label class="check"><input type="checkbox" id="mic" checked> 🎤 Micro</label>
    <label>Son du micro
      <select id="micproc">
        <option value="phone" selected>Traité par le téléphone (comme un appel)</option>
        <option value="raw">Brut (sans réduction de bruit)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>Résolution
      <select id="res">
        <option value="640x480">480p</option>
        <option value="1280x720" selected>720p</option>
        <option value="1920x1080">1080p</option>
      </select>
    </label>
    <label>Images/s
      <select id="fps"><option>24</option><option selected>30</option><option>60</option></select>
    </label>
    <label>Codage
      <select id="codec">
        <option value="h264" selected>H.264 matériel</option>
        <option value="jpeg">JPEG (secours)</option>
      </select>
    </label>
    <label>Débit
      <select id="bitrate">
        <option value="3000000">3 Mb/s</option>
        <option value="6000000" selected>6 Mb/s</option>
        <option value="10000000">10 Mb/s</option>
        <option value="16000000">16 Mb/s</option>
      </select>
    </label>
  </div>
  <div id="status">Prêt.</div>
</div>
<script>
'use strict';
// Protocole (WebSocket binaire) : 1er octet = type. 1 = H.264 image clé, 2 = H.264 delta, 3 = JPEG,
// 4 = son du micro : fréquence (uint32 LE) puis échantillons int16 LE mono.
// Le PC peut envoyer "key" (demande d'image clé) et "ok" (accusé JPEG).
const $ = id => document.getElementById(id);
const v = $('v'), statusEl = $('status'), goBtn = $('go');
const key = new URLSearchParams(location.search).get('k');
let facing = 'user', torch = false;
let stream = null, ws = null, running = false, wakeLock = null;
let encoder = null, codecInUse = null, forceKey = true, frameNo = 0;
let reader = null, rvfcHandle = null;
let jpegInFlight = 0;
let sentCount = 0, droppedCount = 0, lastStat = performance.now();
const canvas = document.createElement('canvas');
const ctx2d = canvas.getContext('2d', { alpha: false, desynchronized: true });

let audioCtx = null, micStream = null, micNode = null, audioSent = 0;
const setStatus = t => { statusEl.textContent = t; };
const fps = () => Number($('fps').value);

async function openCamera() {
  stopCapture();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (!$('cam').checked) { v.srcObject = null; return; }
  const [w, h] = $('res').value.split('x').map(Number);
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: facing, width: { ideal: w }, height: { ideal: h },
             frameRate: { ideal: fps(), max: fps() } }
  });
  v.srcObject = stream;
  await v.play();
  torch = false;
  await setupEncoder();
  startCapture();
}

// Le micro passe par un AudioWorklet : blocs de 20 ms en int16, envoyés tels quels au PC.
const TAP = `class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(960); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 32768 : s * 32767;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(960); this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;

async function openMic() {
  closeMic();
  if (!$('mic').checked) return;
  const phone = $('micproc').value === 'phone';
  // Traité : réduction de bruit, anti-écho et gain automatique du téléphone, comme en appel.
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, echoCancellation: phone, noiseSuppression: phone, autoGainControl: phone } });
  audioCtx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: 'text/javascript' })));
  micNode = new AudioWorkletNode(audioCtx, 'tap');
  micNode.port.onmessage = e => sendAudio(e.data);
  const mute = audioCtx.createGain();
  mute.gain.value = 0;  // rien n'est joué sur le téléphone, le nœud est juste « tiré » par la sortie
  audioCtx.createMediaStreamSource(micStream).connect(micNode);
  micNode.connect(mute).connect(audioCtx.destination);
  await audioCtx.resume();
}

function closeMic() {
  if (micNode) { micNode.port.onmessage = null; micNode.disconnect(); micNode = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

function sendAudio(pcm) {
  if (!ws || ws.readyState !== 1 || ws.bufferedAmount > 200000) return;
  const buf = new Uint8Array(pcm.byteLength + 5);
  buf[0] = 4;
  new DataView(buf.buffer).setUint32(1, audioCtx ? audioCtx.sampleRate : 48000, true);
  buf.set(new Uint8Array(pcm), 5);
  ws.send(buf);
  audioSent++;
  if (!stream) stats();  // micro seul : pas d'images pour rafraîchir l'état
}

function codecString(w, h) {
  // Profil Baseline (pas d'images B = pas de retard), niveau selon la taille.
  const mbps = (w * h) / 256 * fps();
  const level = mbps > 245760 ? '33' : mbps > 108000 ? '2a' : '1f';
  return 'avc1.42e0' + level;
}

async function setupEncoder() {
  if (encoder) { try { encoder.close(); } catch (e) {} encoder = null; }
  codecInUse = 'jpeg';
  if ($('codec').value !== 'h264' || !('VideoEncoder' in window)) return;
  const s = stream.getVideoTracks()[0].getSettings();
  const w = s.width & ~1, h = s.height & ~1;
  const config = {
    codec: codecString(w, h), width: w, height: h,
    bitrate: Number($('bitrate').value), framerate: fps(),
    latencyMode: 'realtime', hardwareAcceleration: 'prefer-hardware',
    bitrateMode: 'variable', avc: { format: 'annexb' },
  };
  try {
    const support = await VideoEncoder.isConfigSupported(config);
    if (!support.supported) { config.hardwareAcceleration = 'no-preference'; }
    if (!(await VideoEncoder.isConfigSupported(config)).supported) return;
    encoder = new VideoEncoder({
      output: chunk => {
        if (!ws || ws.readyState !== 1) return;
        const buf = new Uint8Array(chunk.byteLength + 1);
        buf[0] = chunk.type === 'key' ? 1 : 2;
        chunk.copyTo(buf.subarray(1));
        ws.send(buf);
        sentCount++;
      },
      error: e => { setStatus('Erreur encodeur : ' + e.message + ' → JPEG'); codecInUse = 'jpeg'; },
    });
    encoder.configure(config);
    codecInUse = 'h264';
    forceKey = true;
  } catch (e) { codecInUse = 'jpeg'; }
}

function handleFrame(frame) {
  // frame : VideoFrame. On la ferme toujours.
  try {
    if (!running || !ws || ws.readyState !== 1) return;
    // Contre-pression : si le réseau n'arrive pas à suivre, on saute l'image AVANT encodage
    // (sauter après casserait le décodage H.264) pour que la latence ne s'accumule pas.
    if (ws.bufferedAmount > 400000) { droppedCount++; return; }
    if (codecInUse === 'h264' && encoder && encoder.state === 'configured') {
      if (encoder.encodeQueueSize > 2) { droppedCount++; return; }
      const keyFrame = forceKey || frameNo % (fps() * 2) === 0;
      forceKey = false;
      encoder.encode(frame, { keyFrame });
      frameNo++;
    } else {
      sendJpeg(frame);
    }
  } finally {
    frame.close();
    stats();
  }
}

function sendJpeg(frame) {
  if (jpegInFlight >= 2) { droppedCount++; return; }
  if (canvas.width !== frame.displayWidth) { canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; }
  ctx2d.drawImage(frame, 0, 0);
  jpegInFlight++;
  canvas.toBlob(b => {
    if (!b || !ws || ws.readyState !== 1) { jpegInFlight--; return; }
    b.arrayBuffer().then(ab => {
      const buf = new Uint8Array(ab.byteLength + 1);
      buf[0] = 3; buf.set(new Uint8Array(ab), 1);
      ws.send(buf); sentCount++;
    });
  }, 'image/jpeg', 0.85);
}

function startCapture() {
  const track = stream.getVideoTracks()[0];
  if ('MediaStreamTrackProcessor' in window) {
    // Accès direct aux images de la caméra, sans passer par un <canvas>.
    const proc = new MediaStreamTrackProcessor({ track, maxBufferSize: 1 });
    reader = proc.readable.getReader();
    const r = reader;
    (async () => {
      while (true) {
        const { value, done } = await r.read();
        if (done || r !== reader) { if (value) value.close(); break; }
        handleFrame(value);
      }
    })();
  } else {
    const cb = () => {
      if (!running) return;
      try { handleFrame(new VideoFrame(v, { timestamp: performance.now() * 1000 })); } catch (e) {}
      rvfcHandle = v.requestVideoFrameCallback(cb);
    };
    rvfcHandle = v.requestVideoFrameCallback(cb);
  }
}

function stopCapture() {
  if (reader) { const r = reader; reader = null; r.cancel().catch(() => {}); }
  if (rvfcHandle !== null) { v.cancelVideoFrameCallback(rvfcHandle); rvfcHandle = null; }
}

function stats() {
  const now = performance.now();
  if (now - lastStat < 1000) return;
  const s = stream ? stream.getVideoTracks()[0].getSettings() : null;
  const video = s ? `${codecInUse === 'h264' ? 'H.264 matériel' : 'JPEG'} · ${s.width}×${s.height} · ` +
            `${sentCount} img/s envoyées` + (droppedCount ? ` · ${droppedCount} sautées (réseau lent)` : '')
            : 'Caméra coupée';
  const audio = micStream ? (audioSent ? ' · 🎤 micro envoyé' : ' · 🎤 micro en attente') : '';
  setStatus(video + audio + `\n${location.hostname === 'localhost' ? 'Câble USB' : 'Wi-Fi'}`);
  sentCount = 0; droppedCount = 0; audioSent = 0; lastStat = now;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?k=${encodeURIComponent(key)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { forceKey = true; jpegInFlight = 0; setStatus('Connecté au PC.'); };
  ws.onmessage = e => {
    if (e.data === 'key') forceKey = true;
    else if (e.data === 'ok') jpegInFlight = Math.max(0, jpegInFlight - 1);
  };
  ws.onclose = () => { if (running) { setStatus('Connexion perdue, reconnexion…'); setTimeout(connect, 800); } };
}

async function start() {
  try {
    running = true;
    connect();
    await openCamera();
    try { await openMic(); } catch (e) { setStatus('Micro indisponible : ' + e.message); }
    goBtn.textContent = 'Arrêter'; goBtn.classList.add('stop');
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  } catch (e) { running = false; closeMic(); setStatus('Erreur caméra : ' + e.message); }
}

function stop() {
  running = false;
  stopCapture();
  if (encoder) { try { encoder.close(); } catch (e) {} encoder = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  closeMic();
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  goBtn.textContent = 'Démarrer'; goBtn.classList.remove('stop');
  setStatus('Arrêté.');
}

goBtn.onclick = () => running ? stop() : start();
// Passe le lien d'appairage à l'appli Android ; sans l'appli, Chrome revient sur cette page.
$('app').onclick = async () => {
  try {
    const link = await (await fetch('/applink?k=' + encodeURIComponent(key), { cache: 'no-store' })).text();
    if (running) stop();
    const u = new URL(link);
    location.href = `intent://${u.host}${u.search}#Intent;scheme=phonecam;package=com.phonecam.app;` +
                    `S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
  } catch (e) { setStatus('Appli indisponible : ' + e.message); }
};
$('flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; if (running) await openCamera(); };
$('light').onclick = async () => {
  if (!stream) return;
  torch = !torch;
  try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch }] }); }
  catch (e) { setStatus('Lampe indisponible sur cette caméra.'); }
};
for (const id of ['res', 'fps', 'codec', 'bitrate', 'cam']) $(id).onchange = () => { if (running) openCamera(); };
for (const id of ['mic', 'micproc']) $(id).onchange = () => {
  if (running) openMic().catch(e => setStatus('Micro indisponible : ' + e.message));
};
document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible') {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    if (audioCtx) audioCtx.resume().catch(() => {});
    forceKey = true;
  }
});
</script>
</body>
</html>
